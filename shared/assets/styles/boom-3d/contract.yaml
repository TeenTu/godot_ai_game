id: boom-3d
name: 百怪夜巡·新国风轻 Q 原生 3D
description: >-
  为竖屏俯视割草动作《百怪夜巡》定制的新国风轻 Q 原生 3D 风格。冷墨夜(#18233B)与
  石板灰构成夜景环境，暖灯琥珀(#F2B84B)标识玩家/安全，朱砂红(#B84235)用于封印与危险，
  灵雾青绿(#5FC5AD)用于妖力。材质为米纸、布、深木、旧铜和薄雾；轮廓低面数、清晰、
  可在俯视小屏辨认。主角是背方灯匣的年轻女灯使，基础角色图不持武器。禁止糖果嘉年华、
  果冻气球、全屏暖橙、照片级写实、真实枪械和文字水印。本契约产出 2D 贴图、图标与
  角色参考，不产出网格/拓扑/骨骼。
prompt_template: >-
  新国风轻 Q 原生 3D 游戏素材，{subject}，低面数可读剪影，米纸、哑光布料、深木与旧铜材质，
  墨夜蓝(#18233B)冷环境光与暖灯琥珀(#F2B84B)局部光源，朱砂红(#B84235)和灵雾青绿(#5FC5AD)
  仅作功能点缀，柔和短阴影，俯视三分之四游戏视角，主体居中完整，透明背景，无文字无水印，
  不要糖果塑料、果冻气球、真实枪械或照片写实质感
# 各分类在 prompt_template 后追加的指令（供素材请求方/生图 agent 按类目拼接）：
#   characters / enemies : "{对象详细描述，见 docs/art_bible_boom.md §3/§5}，全身/全形，透明底"
#   props                : "单个场景道具，{对象}，木/纸/铜材质，轮廓简洁"
#   icons                : "单个法器或符印图标，米纸底与琥珀/朱砂功能色，高对比"
#   backgrounds          : "竖向全屏雨夜异闻场景，中心可玩区域留白，允许不透明背景"
#   floors               : "俯视无缝平铺湿石板/木地面纹理，top-down tileable，边缘必须循环"
image_params:
  size: 1024x1024
  quality: high
  background: transparent
categories: [characters, enemies, props, icons, backgrounds, floors]
