name: Build and Deploy to GitHub Pages

# 多游戏流水线（参考 godotengine/godot-demo-projects 的 export_web.yml）：
# 遍历 games/*/ 下的每个独立工程 -> 注入共享 addons -> 导入 -> 冒烟测试 ->
# Web 导出到 dist/<游戏名>/ -> 生成索引页 -> 整体部署 GitHub Pages。
#
# 新增游戏 = 新建 games/<name>/（含 project.godot 与名为 "Web" 的导出预设），
# 推送到 main 即自动发布到 https://teentu.github.io/godot_ai_game/<name>/
on:
  push:
    branches:
      - main
  workflow_dispatch:

# NOTE ON VERSIONS:
# - `container.image` does NOT support env vars in GitHub Actions, so the
#   Docker tag below is hardcoded. It must match GODOT_VERSION in `env`.
# - If you upgrade Godot locally, update BOTH the image tag below and
#   GODOT_VERSION. Check available tags first:
#   https://hub.docker.com/r/barichello/godot-ci/tags
env:
  GODOT_VERSION: "4.5"

# Permissions required by the official GitHub Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push to main cancels a running build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    name: Lint GDScript (gdtoolkit)
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install gdtoolkit
        run: pip install --quiet "gdtoolkit==4.5.0"
      - name: Run gdlint + gdformat check
        run: |
          gdlint games/ shared/
          gdformat --check games/ shared/
      - name: Asset size gate (docs/asset_pipeline.md)
        run: |
          # 素材体积红线（分级，design_m5_weapons.md §6/§7 横条动画放宽）：
          #   默认：shared/assets 与 games/*/assets/images 单张 PNG >512KB 不合格；
          #   放宽：games/*/assets/images/characters|icons 下允许至 1536KB（1.5MB），
          #        因为 2048×256 透明底 256 色横条压后可能到 800KB-1.2MB。
          oversized=$({
            find shared/assets games/*/assets/images -name "*.png" -size +512k \
              -not -path "games/*/assets/images/characters/*" \
              -not -path "games/*/assets/images/icons/*" 2>/dev/null
            find games/*/assets/images/characters games/*/assets/images/icons \
              -name "*.png" -size +1536k 2>/dev/null
          } | sort -u)
          if [ -n "$oversized" ]; then
            echo "Asset(s) too large (default >512KB; characters/ & icons/ >1536KB):"
            echo "$oversized"
            exit 1
          fi
          echo "asset size gate: OK"

  export-web:
    name: Export Web builds (all games)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5 # must match GODOT_VERSION above
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # 显式指定 bash：container 里的 job 默认用 sh(dash)。
      - name: Export every game
        shell: bash
        run: |
          set -euo pipefail
          BASEDIR="$PWD"
          mkdir -v -p "$BASEDIR/dist"

          for game in games/*/; do
            [ -f "${game}project.godot" ] || continue
            name="$(basename "$game")"
            echo ""
            echo "================================================================================"
            echo "Exporting game: $name"
            echo "================================================================================"

            # 注入共享支持套件 + 共享素材（与 tools/sync_shared.sh 做的事一致）。
            if [ -d shared/addons ]; then
              mkdir -p "${game}addons"
              cp -r shared/addons/. "${game}addons/"
            fi
            # 按 [game_kit] asset_style 注入共享素材到 assets/_shared/。
            style=$(awk -v k="asset_style" '
                $0 ~ /^\[game_kit\]$/ { s=1; next }
                s && /^\[/ { s=0 }
                s && index($0, k"=") == 1 { v=$0; sub(/^[^=]*=/, "", v); gsub(/[" ]/, "", v); print v }
            ' "${game}project.godot" || true)
            if [ -n "$style" ] && [ -d "shared/assets/styles/$style" ]; then
              rm -rf "${game}assets/_shared"
              mkdir -p "${game}assets/_shared"
              cp -r "shared/assets/styles/$style/." "${game}assets/_shared/"
            fi

            # 首次导入：注册全局类 / 生成资源缓存。
            godot --headless --path "$game" --import

            # 可选的无头试玩冒烟测试（工程里带 tools/play_test.gd 才跑）。
            if [ -f "${game}tools/play_test.gd" ]; then
              godot --headless --path "$game" --script res://tools/play_test.gd \
                2>&1 | tee "/tmp/play_${name}.log"
              grep -q "PLAY_TEST result=PASS" "/tmp/play_${name}.log" \
                || { echo "smoke test FAILED for $name"; exit 1; }
            fi

            mkdir -v -p "$BASEDIR/dist/$name"
            godot --headless --path "$game" --verbose \
              --export-release "Web" "$BASEDIR/dist/$name/index.html"
            # Cache-bust: 给 pck 请求追加 commit 前缀，浏览器永不吃到旧包
            # （Godot 加载器支持 mainPack 覆盖，fetch 带查询串不影响加载）。
            sed -i "s|\"args\":\[\]|\"args\":[],\"mainPack\":\"index.pck?v=${GITHUB_SHA::7}\"|" \
              "$BASEDIR/dist/$name/index.html"
            grep -q "mainPack" "$BASEDIR/dist/$name/index.html" \
              || { echo "cache-bust patch FAILED for $name"; exit 1; }
            # 关掉 Pages 的 Jekyll，免得它吞掉带下划线的文件
            touch "$BASEDIR/dist/$name/.nojekyll"
          done

          # 构建摘要：显示在 Actions run 的 Summary 页，一眼看清每个游戏的状态。
          {
            echo "## 🎮 Build summary"
            echo ""
            echo "| Game | Smoke test | Web build |"
            echo "|---|---|---|"
            for game in games/*/; do
              [ -f "${game}project.godot" ] || continue
              name="$(basename "$game")"
              size="$(du -sh "$BASEDIR/dist/$name" 2>/dev/null | cut -f1)"
              if [ -f "${game}tools/play_test.gd" ]; then
                smoke="✅ passed"
              else
                smoke="—"
              fi
              echo "| [$name](https://teentu.github.io/godot_ai_game/$name/) | $smoke | $size |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Generate index page
        shell: bash
        run: |
          set -euo pipefail
          {
            cat <<'HEAD'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Godot Games</title>
          <style>
            body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
                   align-items: center; font-family: system-ui, sans-serif;
                   background: #1a1a2e; color: #eee; }
            h1 { margin: 2.5rem 0 0.5rem; font-weight: 600; }
            p.sub { margin: 0 0 2rem; color: #9aa; }
            .grid { display: flex; flex-wrap: wrap; gap: 1.25rem; justify-content: center;
                    padding: 0 1rem 3rem; }
            a.card { display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
                     width: 200px; padding: 1.5rem 1rem; border-radius: 12px;
                     background: #24243e; color: inherit; text-decoration: none;
                     transition: transform .15s, background .15s; }
            a.card:hover { transform: translateY(-4px); background: #2e2e50; }
            a.card img { border-radius: 14px; }
            a.card .title { font-size: 1.05rem; }
            a.card .dir { font-size: 0.8rem; color: #889; }
            footer { color: #778; font-size: 0.85rem; padding-bottom: 2rem; }
          </style>
          </head>
          <body>
          <h1>🎮 Godot Games</h1>
          <p class="sub">由 GitHub Actions 自动构建 · Godot 4.5</p>
          <div class="grid">
          HEAD
            for game in games/*/; do
              [ -f "${game}project.godot" ] || continue
              name="$(basename "$game")"
              title="$(grep 'config/name' "${game}project.godot" | head -1 | cut -d '"' -f 2)"
              [ -n "$title" ] || title="$name"
              echo "<a class='card' href='$name/'><img width='64' height='64' src='$name/index.icon.png' alt=''><span class='title'>$title</span><span class='dir'>/$name/</span></a>"
            done
            cat <<'FOOT'
          </div>
          <footer>push to main = auto build &amp; deploy</footer>
          </body>
          </html>
          FOOT
          } > dist/index.html
          echo "index.html generated:"; ls -la dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
